# Make flatpak apps visible to systemd/GDM-launched GNOME sessions:
# - XDG_DATA_DIRS -> app .desktop launchers show up in the GNOME launch menu
# - PATH -> app command stubs are available in session-spawned terminals
# System installs (/var/lib/flatpak) and --user installs (~/.local/share/flatpak)
# The default /usr/local/share:/usr/share is hardcoded because the generator
# cannot see the running XDG_DATA_DIRS value
XDG_DATA_DIRS=/var/lib/flatpak/exports/share:${HOME}/.local/share/flatpak/exports/share:/usr/local/share:/usr/share
PATH=/var/lib/flatpak/exports/bin:${HOME}/.local/share/flatpak/exports/bin:${PATH}
